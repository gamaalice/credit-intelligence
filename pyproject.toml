[project]
name = "credit-intelligence"
version = "0.1.0"
description = "Educational credit-default modeling project using the UCI public dataset."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.159.1",
    "httpx2>=2.16.0",
    "mlflow==3.17.2",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pyspark==4.2.0",
    "pytest==9.1.1",
    "scikit-learn==1.9.1",
    "streamlit==1.66.1",
    "uvicorn==0.54.0",
    "xlrd==2.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
